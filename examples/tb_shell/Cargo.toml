[package]
name = "tb-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A thin shell around Splash and Relax-JIT surfaces: one JSON store, a socket, a top strip"

[dependencies]
# `dock` stays off (its ghost tab draws in the top overlay tier); `rich_text` turns on
# native GPU `Markdown`, `TextFlow`, `Html`, `MathView` (LaTeX), and `LogList`.
makepad-widgets = { path = "../../widgets", version = "2.0.0", default-features = false, features = ["rich_text"] }
makepad-app-terminal = { path = "../../apps/terminal", version = "0.1.0", default-features = false }
makepad-micro-serde = { path = "../../libs/micro_serde", version = "1.0.0" }
makepad-remote = { path = "../../libs/remote", version = "0.1.0" }
